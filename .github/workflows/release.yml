name: Release images

# On every push to main: build both images for Intel/AMD and ARM (Apple
# Silicon) machines and publish them to the GitHub Container Registry, tagged
# with the commit SHA and "latest".

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, web]
    steps:
      - uses: actions/checkout@v4

      # Registry image names must be lower case; the repository owner may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      # QEMU lets the x86 runner build the ARM image too.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # A token GitHub creates for this run only. No secret is stored in the repo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}-multiarch
          cache-to: type=gha,scope=${{ matrix.app }}-multiarch,mode=max
