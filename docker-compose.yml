# Internet Nervous System: the whole stack.
#
#   docker compose up mongo            database only, for native development (pnpm dev)
#   docker compose --profile demo up   full stack on recorded data  -> http://localhost:8080
#   docker compose --profile live up   full stack on the real feeds -> http://localhost:8080
#   docker compose --profile loadtest up   server + client fleet for load tests (see below)
#
# Add --build after "up" to rebuild the images from source.

name: ins

# Settings shared by the server in both modes and by the seed job.
x-server: &server
  build:
    context: .
    dockerfile: apps/server/Dockerfile
  image: ins-server:local
  depends_on:
    mongo:
      condition: service_healthy

x-server-env: &server-env
  NODE_ENV: production
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Defaults to the mongo container below. Set MONGODB_URI to use MongoDB Atlas instead.
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/ins}
  RIS_CLIENT_NAME: ${RIS_CLIENT_NAME:-internet-nervous-system}
  RIS_COLLECTORS: ${RIS_COLLECTORS:-rrc00,rrc10,rrc11,rrc14}
  ATLAS_MEASUREMENTS: ${ATLAS_MEASUREMENTS:-1001,1008,1006}
  # Sign-in is optional: without a Google client ID the app is visitor-only.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  JWT_SECRET: ${JWT_SECRET:-}
  # Plain-HTTP local runs need the cookie without the Secure flag in some browsers.
  COOKIE_SECURE: ${COOKIE_SECURE:-}

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017' # reachable from this machine only
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # The same image runs in one of two modes. Both answer to the name "server"
  # on the network, so the proxy does not care which one is up.
  server:
    <<: *server
    profiles: [live]
    restart: unless-stopped
    environment:
      <<: *server-env
      MODE: live
    networks:
      default:
        aliases: [server]

  server-replay:
    <<: *server
    profiles: [demo]
    restart: unless-stopped
    environment:
      <<: *server-env
      MODE: replay
    networks:
      default:
        aliases: [server]

  # Runs once and exits: prepares the database (and, from Phase 2, loads the
  # recorded history and replay files in deploy/seed).
  seed:
    <<: *server
    profiles: [live, demo]
    restart: 'no'
    command: ['node', 'dist/seed.js']
    environment:
      <<: *server-env

  proxy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ins-web:local
    profiles: [live, demo]
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - '${HTTP_PORT:-8080}:8080'
    volumes:
      - caddy-data:/data # certificates, when SITE_ADDRESS is a real domain

  # Load tests (Phase 3):  JWT_SECRET=... LOADTEST_ARGS="--clients 500 --speed 50" \
  #   docker compose --profile loadtest up --build --abort-on-container-exit loadtest
  # A server on recorded data with connection limits raised (all clients come from one
  # address), and the client fleet. Results land in tools/loadtest/results/.
  server-loadtest:
    <<: *server
    profiles: [loadtest]
    environment:
      <<: *server-env
      MODE: replay
      # The fleet signs its admin token with the same secret (see tools/loadtest).
      JWT_SECRET: ${JWT_SECRET:-}
      # Its own database, so load-test minutes never mix with real history.
      MONGODB_URI: mongodb://mongo:27017/ins_loadtest
      REFDATA: 'off'
      SOCKET_CONNECTIONS_PER_MIN: 1000000
      API_RATE_PER_MIN: 1000000
      REPLAY_FACEBOOK_FILE: /replay/facebook-20211004.ndjson.gz
    volumes:
      - ./deploy/seed/replay:/replay:ro

  loadtest:
    image: node:22-alpine
    profiles: [loadtest]
    depends_on:
      server-loadtest:
        condition: service_healthy
    working_dir: /repo/tools/loadtest
    volumes:
      - .:/repo # the tool and its dependencies (plain JavaScript), and the results folder
    environment:
      JWT_SECRET: ${JWT_SECRET:-}
    command: >-
      sh -c "node --disable-warning=ExperimentalWarning src/cli.ts run
      --base http://server-loadtest:3000 ${LOADTEST_ARGS:-}"

volumes:
  mongo-data:
  caddy-data:
