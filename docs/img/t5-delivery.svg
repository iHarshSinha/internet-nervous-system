<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">
<text x="16" y="26" font-size="16" font-weight="600" fill="#8a8f98">Bytes sent per client per second (200 clients, 10x replay)</text>
<text x="16" y="44" font-size="12" fill="#8a8f98">Load test T5: each delivery optimisation switched off in turn. Shorter is better.</text>
<text x="220" y="78.0" font-size="13" text-anchor="end" fill="#8a8f98">All optimisations on</text>
<rect x="230" y="56" width="80.4" height="34" rx="3" fill="#2bb3c9"/>
<text x="318.4" y="71.0" font-size="13" font-weight="600" fill="#8a8f98">1,565 B/s</text>
<text x="318.4" y="86.0" font-size="11" fill="#8a8f98">2.59 frames/s, p99 15 ms</text>
<text x="220" y="128.0" font-size="13" text-anchor="end" fill="#8a8f98">JSON instead of MessagePack</text>
<rect x="230" y="106" width="113.9" height="34" rx="3" fill="#d98a2b"/>
<text x="351.9" y="121.0" font-size="13" font-weight="600" fill="#8a8f98">2,216 B/s  (x1.4)</text>
<text x="351.9" y="136.0" font-size="11" fill="#8a8f98">2.59 frames/s, p99 15 ms</text>
<text x="220" y="178.0" font-size="13" text-anchor="end" fill="#8a8f98">Every frame to every client</text>
<rect x="230" y="156" width="117.2" height="34" rx="3" fill="#d98a2b"/>
<text x="355.2" y="171.0" font-size="13" font-weight="600" fill="#8a8f98">2,280 B/s  (x1.5)</text>
<text x="355.2" y="186.0" font-size="11" fill="#8a8f98">2.69 frames/s, p99 19 ms</text>
<text x="220" y="228.0" font-size="13" text-anchor="end" fill="#8a8f98">Conflation off</text>
<rect x="230" y="206" width="291.5" height="34" rx="3" fill="#d9534f"/>
<text x="529.5" y="221.0" font-size="13" font-weight="600" fill="#8a8f98">5,672 B/s  (x3.6)</text>
<text x="529.5" y="236.0" font-size="11" fill="#8a8f98">66.69 frames/s, p99 161 ms</text>
<text x="220" y="278.0" font-size="13" text-anchor="end" fill="#8a8f98">All three off</text>
<rect x="230" y="256" width="380.0" height="34" rx="3" fill="#d9534f"/>
<text x="618.0" y="271.0" font-size="13" font-weight="600" fill="#8a8f98">7,395 B/s  (x4.7)</text>
<text x="618.0" y="286.0" font-size="11" fill="#8a8f98">63.88 frames/s, p99 99 ms</text>
</svg>